<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Chorégraphie</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#faf7f5; --card:#ffffff; --text:#2d2a32; --muted:#8a8390;
    --accent:#c0447c; --accent2:#6b4fa0; --border:#ece6ea;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1b1720; --card:#251f2c; --text:#f1ecf4; --muted:#a99fb0;
      --accent:#e0629b; --accent2:#9683d6; --border:#382f42;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1b1720; --card:#251f2c; --text:#f1ecf4; --muted:#a99fb0;
    --accent:#e0629b; --accent2:#9683d6; --border:#382f42;
  }
  html{scroll-padding-top: env(safe-area-inset-top, 0px); height:100%;}
  body{background:var(--bg); color:var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height:100%; margin:0;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px;}
  textarea, input[type=text]{background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:10px;}
  textarea:focus, input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .btn-main{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white;}
  .tab-btn.active{background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white;}
  .tab-btn{background:var(--card); color:var(--text); border:1px solid var(--border);}
  .chkbox{border:1px solid var(--border); border-radius:10px;}
  .chkbox:has(input:checked){border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--card));}
  ::-webkit-scrollbar{height:6px; width:6px;}
  .modal-bg{background:rgba(0,0,0,0.5);}
</style>
</head>
<body>
<div id="app" class="max-w-3xl mx-auto p-4 pb-16"></div>

<script>
const STORE_KEY = "choreo_projects_v2";
const SHARE_URL = "https://eps-kbapp.github.io/Danse/";

const TAB_DEFS = [
  {id:'general', label:'Thème général'},
  {id:'espace', label:'Espace'},
  {id:'temps', label:'Temps'},
  {id:'flux', label:'Flux/Énergie'},
  {id:'procedes', label:'Procédés'},
  {id:'interpretation', label:'Interprétation'},
  {id:'impact', label:'Impact émotionnel'},
  {id:'lexique', label:'📖 Lexique'}
];

const NIVEAUX_LABELS = {sol:'Sol', debout:'Debout', saut:'Saut(s)'};
const CORPOREL_LABELS = {distal:'Distal (bras et jambes)', proximal:'Proximal (buste, reste du corps)'};
const TEMPS_LABELS = {acceleres:'Accélérés', ralentis:'Ralentis', accents:'Accents', arrets:'Arrêts'};
const FLUX_LABELS = {lie:'Lié(s)', saccade:'Saccadé(s)'};
const ENERGIE_LABELS = {puissante:'Puissante', retenue:'Retenue', controlee:'Contrôlée'};
const PROCEDES_LABELS = {unisson:'Unisson(s)', lache_rattrape:'Lâché(s)-rattrapé(s)', canon:'Canon(s)', contrepoint:'Contrepoint(s)', cascade:'Cascade(s)', transposition:'Transposition(s)', inversion:'Inversion(s)', repetition:'Répétition(s)', concassage:'Concassage(s)', accumulation:'Accumulation(s)'};
const RELATIONS_LABELS = {miroir:'Miroir(s)', contact:'Contact(s) (tirer, porter...)', porte:'Porté(s)', regard:'Placement(s) du regard'};
const STRUCTURE_LABELS = {scenario:'Scénario', couplet:'Couplet-refrain', thematique:'Thématique'};
const REGARD_LABELS = {tout_le_temps:'Tout le temps', parfois:'Parfois', jamais:'Jamais'};
const TECHNIQUE_LABELS = {complexe:'Complexe', simple:'Simple', imprecis:'Imprécis'};
const MEMO_LABELS = {parfaite:"Connaît parfaitement", erreurs:"Connaît avec quelques erreurs", perdu:"Suit quelqu'un, se perd"};
const ENGAGEMENT_LABELS = {implique:"S'implique", applique:"S'applique", recite:"Récite"};

const LEXIQUE = [
  {theme:"Espace", terme:"Espace scénique", def:"L'aire de jeu dans laquelle évoluent les danseurs, vue et cadrée par le public."},
  {theme:"Espace", terme:"Niveaux", def:"Hauteur du corps dans l'espace : niveau bas (sol), moyen (debout plié), haut (sauts, portés)."},
  {theme:"Espace", terme:"Trajectoires / directions", def:"Chemins parcourus par les danseurs dans l'espace : droites, courbes, diagonales, spirales..."},
  {theme:"Espace", terme:"Jardin / Cour", def:"Repères de scène vus du point de vue du spectateur : jardin = côté gauche, cour = côté droit."},
  {theme:"Espace", terme:"Espace corporel distal / proximal", def:"Distal : mouvement porté par les extrémités (bras, jambes). Proximal : mouvement porté par le centre du corps (buste)."},
  {theme:"Temps", terme:"Accents", def:"Appuis marqués, temps forts placés volontairement dans la phrase dansée."},
  {theme:"Temps", terme:"Arrêts", def:"Suspensions, immobilités volontaires dans le mouvement (arrêt sur image)."},
  {theme:"Temps", terme:"Accélérés / Ralentis", def:"Variations de vitesse d'exécution du mouvement au cours de la chorégraphie."},
  {theme:"Flux / Énergie", terme:"Flux lié / saccadé", def:"Lié : le mouvement s'enchaîne sans rupture. Saccadé : le mouvement est haché, par à-coups."},
  {theme:"Flux / Énergie", terme:"Énergie puissante / retenue / contrôlée", def:"Puissante : geste fort, explosif. Retenue : énergie contenue. Contrôlée : geste maîtrisé, précis."},
  {theme:"Procédés de composition", terme:"Unisson", def:"Tous les danseurs exécutent le même mouvement en même temps."},
  {theme:"Procédés de composition", terme:"Cascade", def:"Un même mouvement est reproduit par les danseurs les uns après les autres, en léger décalage."},
  {theme:"Procédés de composition", terme:"Canon", def:"Un mouvement est répété par plusieurs danseurs, chacun démarrant avec un décalage régulier."},
  {theme:"Procédés de composition", terme:"Contrepoint", def:"Plusieurs mouvements différents se déroulent en même temps sur scène, créant plusieurs points d'intérêt."},
  {theme:"Procédés de composition", terme:"Lâché(s)-rattrapé(s)", def:"Un mouvement est lancé avec un relâchement du poids du corps, puis repris (rattrapé) par le danseur ou un partenaire."},
  {theme:"Procédés de composition", terme:"Transposition", def:"Un mouvement est rejoué en changeant de partie du corps, de niveau ou de direction."},
  {theme:"Procédés de composition", terme:"Inversion", def:"Un mouvement est rejoué à l'envers (chronologie inversée)."},
  {theme:"Procédés de composition", terme:"Répétition", def:"Un même mouvement ou motif est répété plusieurs fois."},
  {theme:"Procédés de composition", terme:"Concassage", def:"Un mouvement est fragmenté, découpé en petits morceaux et redistribué."},
  {theme:"Procédés de composition", terme:"Accumulation", def:"On ajoute progressivement des éléments à une phrase dansée."},
  {theme:"Procédés de composition", terme:"Relations : Miroir", def:"Un danseur reproduit en symétrie le mouvement d'un partenaire, comme un reflet."},
  {theme:"Procédés de composition", terme:"Relations : Contact / Porté", def:"Les danseurs se touchent, se tirent, se portent : appuis et poids partagés entre partenaires."},
  {theme:"Procédés de composition", terme:"Structure : Scénario", def:"La chorégraphie suit une histoire, avec un déroulement narratif (début, péripéties, fin)."},
  {theme:"Procédés de composition", terme:"Structure : Couplet-refrain", def:"La chorégraphie alterne des parties qui reviennent (refrain) et des parties qui évoluent (couplets), souvent calée sur la musique."},
  {theme:"Procédés de composition", terme:"Structure : Thématique", def:"La chorégraphie est organisée autour d'un thème central, sans trame narrative ni structure musicale imposée."},
  {theme:"Interprétation", terme:"Placement du regard", def:"Direction et intention du regard du danseur, qui renforce l'expressivité et la communication avec le public."},
  {theme:"Interprétation", terme:"Technique corporelle", def:"Niveau de maîtrise du geste : complexe, simple ou imprécis."},
  {theme:"Interprétation", terme:"Mémorisation", def:"Degré de connaissance de la chorégraphie par le danseur, de la maîtrise parfaite à la perte de repères."},
  {theme:"Interprétation", terme:"Engagement émotionnel", def:"S'implique (vit le mouvement), s'applique (exécute consciencieusement) ou récite (exécute sans y mettre d'intention)."},
  {theme:"Impact émotionnel", terme:"Ressenti du spectateur", def:"Émotion ressentie en regardant la pièce, et ce qui, dans la chorégraphie, la déclenche."},
  {theme:"Impact émotionnel", terme:"Moment fort", def:"Instant de la chorégraphie particulièrement marquant : surprise, rupture, intensité."}
];

function loadProjects(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ return []; } }
function saveProjects(list){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(list)); }catch(e){ console.error(e); } }
function uid(){ return 'p'+Date.now()+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(s){ const m=Math.floor(s/60); const sec=s%60; return m+':'+String(sec).padStart(2,'0'); }

let state = { view:"home", projectId:null, activeTab:"general" };
let chronoInterval = null;

function emptyProject(nom){
  return { id:uid(), nom: nom||"Nouveau projet", date:new Date().toLocaleDateString('fr-FR'),
    eleves: [{nom:"",prenom:""}],
    theme:"", question:"", reflexion:"", musique:"",
    espace:{ niveaux:{sol:false,debout:false,saut:false}, corporel:{distal:false,proximal:false}, propos:"", dessin:null },
    temps:{ checks:{acceleres:false,ralentis:false,accents:false,arrets:false}, propos:"", duree:0 },
    flux:{ flux:{lie:false,saccade:false}, energie:{puissante:false,retenue:false,controlee:false}, propos:"" },
    procedes:{ structure:"", checks:{unisson:false,lache_rattrape:false,canon:false,contrepoint:false,cascade:false,transposition:false,inversion:false,repetition:false,concassage:false,accumulation:false}, relations:{miroir:false,contact:false,porte:false,regard:false}, propos:"" },
    interpretation:{ regard:"", technique:"", memorisation:"", engagement:"" },
    impact:{ ressenti:"", pourquoi:"", prefere:"" }
  };
}

function setPath(obj, path, value){ const parts=path.split('.'); let o=obj; for(let i=0;i<parts.length-1;i++){ o=o[parts[i]]; } o[parts[parts.length-1]]=value; }
function getPath(obj, path){ return path.split('.').reduce((o,k)=> (o? o[k] : o), obj); }
function updatePath(path, value){
  const projects = loadProjects();
  const p = projects.find(pr=>pr.id===state.projectId);
  if(!p) return;
  setPath(p, path, value);
  saveProjects(projects);
}
function debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }

function chk(label, path, checked){
  return `<label class="chkbox flex items-center gap-2 p-2 cursor-pointer">
    <input type="checkbox" class="path-input" data-path="${path}" ${checked?'checked':''}>
    <span class="text-sm">${label}</span></label>`;
}
function radio(name, label, path, value, checked){
  return `<label class="chkbox flex items-center gap-2 p-2 cursor-pointer">
    <input type="radio" name="${name}" class="path-input" data-path="${path}" value="${value}" ${checked?'checked':''}>
    <span class="text-sm">${label}</span></label>`;
}

function render(){
  if(chronoInterval){ clearInterval(chronoInterval); chronoInterval=null; }
  const app = document.getElementById('app');
  if(state.view==="home") app.innerHTML = renderHome();
  else if(state.view==="create") app.innerHTML = renderCreate();
  else if(state.view==="project") app.innerHTML = renderProject();
  attachHandlers();
}

function renderHome(){
  const projects = loadProjects();
  return `
  <header class="text-center py-6">
    <h1 class="text-2xl font-bold" style="color:var(--accent)">🩰 Ma Chorégraphie</h1>
    <p class="text-sm mt-1" style="color:var(--muted)">Construis le projet de danse de ton groupe</p>
  </header>
  <div class="flex gap-3 mb-6">
    <button id="btn-new" class="btn-main flex-1 py-3 rounded-xl font-semibold shadow">➕ Créer un projet</button>
    <button id="btn-share" class="flex-1 py-3 rounded-xl font-semibold card">📱 Partager l'appli</button>
  </div>
  <div class="space-y-3">
    ${projects.length===0 ? `<p class="text-center py-8" style="color:var(--muted)">Aucun projet pour l'instant.</p>` :
      projects.map(p=>`
      <div class="card p-4 flex items-center justify-between gap-2">
        <div class="min-w-0 flex-1 cursor-pointer open-project" data-id="${p.id}">
          <div class="font-semibold truncate">${esc(p.nom)}</div>
          <div class="text-xs" style="color:var(--muted)">${p.eleves.filter(e=>e.nom||e.prenom).length} élève(s) · créé le ${p.date}</div>
        </div>
        <button class="pdf-btn px-3 py-2 rounded-lg text-sm card" data-id="${p.id}" title="Exporter en PDF">📄 PDF</button>
        <button class="del-btn px-2 py-2 rounded-lg text-sm" data-id="${p.id}" style="color:var(--accent)" title="Supprimer">🗑️</button>
      </div>`).join('')}
  </div>
  <div id="share-modal" class="fixed inset-0 modal-bg hidden items-center justify-center z-50 p-4">
    <div class="card p-6 max-w-xs w-full text-center">
      <h3 class="font-bold mb-3">Scanne pour ouvrir l'appli</h3>
      <div id="qr-holder" class="flex justify-center mb-3"></div>
      <p class="text-xs break-all mb-1" style="color:var(--muted)">${SHARE_URL}</p>
      <p class="text-xs mb-4" style="color:var(--muted)">Chaque groupe peut accéder à l'application depuis son téléphone.</p>
      <button id="close-share" class="btn-main px-4 py-2 rounded-lg font-semibold">Fermer</button>
    </div>
  </div>`;
}

function renderCreate(){
  return `
  <header class="py-6">
    <button id="back-home" class="text-sm mb-3" style="color:var(--accent)">← Retour</button>
    <h1 class="text-xl font-bold">Créer un projet</h1>
  </header>
  <div class="card p-4 mb-4">
    <label class="text-sm font-semibold block mb-1">Nom du projet</label>
    <input id="new-nom" type="text" placeholder="Ex : Chorégraphie sur le thème du voyage" class="w-full p-3">
  </div>
  <div class="card p-4">
    <div class="flex items-center justify-between mb-2">
      <label class="text-sm font-semibold">Élèves du groupe</label>
      <button id="add-eleve" class="text-sm px-3 py-1 rounded-lg btn-main">+ Ajouter</button>
    </div>
    <div id="eleves-list" class="space-y-2"></div>
  </div>
  <button id="save-create" class="btn-main w-full py-3 rounded-xl font-semibold mt-5 shadow">Créer le projet</button>`;
}

let tempEleves = [{nom:"",prenom:""}];

function renderElevesList(){
  return tempEleves.map((e,i)=>`
    <div class="flex gap-2">
      <input class="eleve-nom flex-1 p-2" data-i="${i}" placeholder="Nom" value="${esc(e.nom)}">
      <input class="eleve-prenom flex-1 p-2" data-i="${i}" placeholder="Prénom" value="${esc(e.prenom)}">
      ${tempEleves.length>1?`<button class="rm-eleve px-2" data-i="${i}" style="color:var(--accent)">✕</button>`:''}
    </div>`).join('');
}

function renderProject(){
  const projects = loadProjects();
  const p = projects.find(pr=>pr.id===state.projectId);
  if(!p){ state.view="home"; return renderHome(); }
  return `
  <header class="py-4">
    <button id="back-home" class="text-sm mb-2" style="color:var(--accent)">← Tous les projets</button>
    <input id="edit-nom" class="text-xl font-bold w-full p-2 -ml-2" value="${esc(p.nom)}" style="background:transparent;border:none;">
  </header>
  <div class="flex gap-2 overflow-x-auto pb-2 mb-4" style="scrollbar-width:thin;">
    ${TAB_DEFS.map(t=>`<button class="tab-btn shrink-0 px-3 py-2 rounded-lg text-sm font-medium ${state.activeTab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('')}
  </div>
  <div id="tab-content" class="space-y-3"></div>
  <div class="flex gap-3 mt-6">
    <button id="proj-pdf" class="flex-1 py-3 rounded-xl font-semibold card">📄 Exporter en PDF</button>
  </div>
  <p class="text-xs text-center mt-3" style="color:var(--muted)">💾 Sauvegarde automatique sur cet appareil</p>`;
}

function fieldsForTab(p){
  const t = state.activeTab;
  if(t==="general"){
    return `
    <div class="card p-4">
      <label class="text-sm font-semibold block mb-1">👥 Élèves du groupe</label>
      <div class="text-sm" style="color:var(--muted)">${p.eleves.filter(e=>e.nom||e.prenom).map(e=>esc(e.prenom+' '+e.nom)).join(', ')||'—'}</div>
    </div>
    <div class="card p-4"><label class="text-sm font-semibold block mb-1">🎭 Thème de la chorégraphie</label>
      <textarea data-path="theme" rows="2" class="w-full p-3">${esc(p.theme)}</textarea></div>
    <div class="card p-4"><label class="text-sm font-semibold block mb-1">❓ Question / problématique</label>
      <textarea data-path="question" rows="2" class="w-full p-3">${esc(p.question)}</textarea></div>
    <div class="card p-4"><label class="text-sm font-semibold block mb-1">💭 Réflexion du groupe</label>
      <textarea data-path="reflexion" rows="4" class="w-full p-3">${esc(p.reflexion)}</textarea></div>
    <div class="card p-4"><label class="text-sm font-semibold block mb-1">🎵 Musique</label>
      <textarea data-path="musique" rows="2" placeholder="Titre, artiste, durée..." class="w-full p-3">${esc(p.musique)}</textarea></div>`;
  }
  if(t==="espace"){ const e=p.espace; return `
    <div class="card p-4">
      <div class="font-semibold mb-2">🗺️ Tracer le trajet du groupe sur la scène</div>
      <div class="flex justify-between text-xs px-1 mb-1" style="color:var(--muted)"><span>Jardin</span><span>Fond de scène</span><span>Cour</span></div>
      <canvas id="espace-canvas" width="600" height="320" style="width:100%; touch-action:none; display:block; border-radius:10px; border:1px solid var(--border);"></canvas>
      <button id="clear-canvas" class="text-sm mt-2 px-3 py-1 rounded-lg card">🗑️ Effacer le dessin</button>
    </div>
    <div class="card p-4"><div class="font-semibold mb-2">Niveaux exploités</div>
      <div class="grid grid-cols-3 gap-2">${chk('Sol','espace.niveaux.sol',e.niveaux.sol)}${chk('Debout','espace.niveaux.debout',e.niveaux.debout)}${chk('Saut(s)','espace.niveaux.saut',e.niveaux.saut)}</div></div>
    <div class="card p-4"><div class="font-semibold mb-2">Espace corporel</div>
      <div class="grid grid-cols-2 gap-2">${chk('Distal (bras et jambes)','espace.corporel.distal',e.corporel.distal)}${chk('Proximal (buste, reste du corps)','espace.corporel.proximal',e.corporel.proximal)}</div></div>
    <div class="card p-4"><label class="text-sm font-semibold block mb-1">Comment les espaces servent le propos ?</label>
      <textarea data-path="espace.propos" rows="3" class="w-full p-3">${esc(e.propos)}</textarea></div>`;
  }
  if(t==="temps"){ const tm=p.temps; return `
    <div class="card p-4 text-center">
      <div class="font-semibold mb-2">⏱️ Chronomètre</div>
      <div id="chrono-display" class="text-4xl font-bold mb-3" style="color:var(--accent)">${fmtTime(tm.duree)}</div>
      <div class="flex justify-center gap-2">
        <button id="chrono-start" class="px-4 py-2 rounded-lg btn-main font-semibold">START</button>
        <button id="chrono-stop" class="px-4 py-2 rounded-lg card font-semibold">STOP</button>
        <button id="chrono-reset" class="px-4 py-2 rounded-lg card font-semibold">RESET</button>
      </div>
    </div>
    <div class="card p-4"><div class="font-semibold mb-2">Utilisations du temps</div>
      <div class="grid grid-cols-2 gap-2">${chk('Accélérés','temps.checks.acceleres',tm.checks.acceleres)}${chk('Ralentis','temps.checks.ralentis',tm.checks.ralentis)}${chk('Accents','temps.checks.accents',tm.checks.accents)}${chk('Arrêts','temps.checks.arrets',tm.checks.arrets)}</div></div>
    <div class="card p-4"><label class="text-sm font-semibold block mb-1">Comment les différentes utilisations du temps servent-elles le propos ?</label>
      <textarea data-path="temps.propos" rows="3" class="w-full p-3">${esc(tm.propos)}</textarea></div>`;
  }
  if(t==="flux"){ const f=p.flux; return `
    <div class="card p-4"><div class="font-semibold mb-2">FLUX</div>
      <div class="grid grid-cols-2 gap-2">${chk('Lié(s)','flux.flux.lie',f.flux.lie)}${chk('Saccadé(s)','flux.flux.saccade',f.flux.saccade)}</div></div>
    <div class="card p-4"><div class="font-semibold mb-2">ÉNERGIE</div>
      <div class="grid grid-cols-3 gap-2">${chk('Puissante','flux.energie.puissante',f.energie.puissante)}${chk('Retenue','flux.energie.retenue',f.energie.retenue)}${chk('Contrôlée','flux.energie.controlee',f.energie.controlee)}</div></div>
    <div class="card p-4"><label class="text-sm font-semibold block mb-1">Comment l'utilisation du flux et de l'énergie sert-elle le propos ?</label>
      <textarea data-path="flux.propos" rows="3" class="w-full p-3">${esc(f.propos)}</textarea></div>`;
  }
  if(t==="procedes"){ const pr=p.procedes; return `
    <div class="card p-4"><div class="font-semibold mb-2">Structure de la chorégraphie</div>
      <div class="grid grid-cols-3 gap-2">${radio('structure','Scénario','procedes.structure','scenario',pr.structure==='scenario')}${radio('structure','Couplet-refrain','procedes.structure','couplet',pr.structure==='couplet')}${radio('structure','Thématique','procedes.structure','thematique',pr.structure==='thematique')}</div></div>
    <div class="card p-4"><div class="font-semibold mb-2">Procédés de composition utilisés</div>
      <div class="grid grid-cols-2 gap-2">${Object.keys(PROCEDES_LABELS).map(k=>chk(PROCEDES_LABELS[k],'procedes.checks.'+k,pr.checks[k])).join('')}</div></div>
    <div class="card p-4"><div class="font-semibold mb-2">Relations entre les danseurs</div>
      <div class="grid grid-cols-2 gap-2">${Object.keys(RELATIONS_LABELS).map(k=>chk(RELATIONS_LABELS[k],'procedes.relations.'+k,pr.relations[k])).join('')}</div></div>
    <div class="card p-4"><label class="text-sm font-semibold block mb-1">Comment les procédés de composition servent-ils le propos ?</label>
      <textarea data-path="procedes.propos" rows="3" class="w-full p-3">${esc(pr.propos)}</textarea></div>`;
  }
  if(t==="interpretation"){ const it=p.interpretation; return `
    <p class="text-xs px-1" style="color:var(--muted)">À utiliser pour vous auto-évaluer pendant vos répétitions.</p>
    <div class="card p-4"><div class="font-semibold mb-2">Placement du regard</div>
      <div class="grid grid-cols-3 gap-2">${Object.keys(REGARD_LABELS).map(k=>radio('regard',REGARD_LABELS[k],'interpretation.regard',k,it.regard===k)).join('')}</div></div>
    <div class="card p-4"><div class="font-semibold mb-2">Technique corporelle</div>
      <div class="grid grid-cols-3 gap-2">${Object.keys(TECHNIQUE_LABELS).map(k=>radio('technique',TECHNIQUE_LABELS[k],'interpretation.technique',k,it.technique===k)).join('')}</div></div>
    <div class="card p-4"><div class="font-semibold mb-2">Mémorisation de la chorégraphie</div>
      <div class="grid grid-cols-1 gap-2">${Object.keys(MEMO_LABELS).map(k=>radio('memo',MEMO_LABELS[k],'interpretation.memorisation',k,it.memorisation===k)).join('')}</div></div>
    <div class="card p-4"><div class="font-semibold mb-2">Engagement émotionnel</div>
      <div class="grid grid-cols-3 gap-2">${Object.keys(ENGAGEMENT_LABELS).map(k=>radio('engagement',ENGAGEMENT_LABELS[k],'interpretation.engagement',k,it.engagement===k)).join('')}</div></div>`;
  }
  if(t==="impact"){ const im=p.impact; return `
    <div class="card p-4"><label class="text-sm font-semibold block mb-1">Quelle émotion voulez-vous transmettre au spectateur ? Qu'est-ce qui doit le toucher ?</label>
      <textarea data-path="impact.ressenti" rows="3" class="w-full p-3">${esc(im.ressenti)}</textarea></div>
    <div class="card p-4"><label class="text-sm font-semibold block mb-1">Pourquoi et à quel(s) moment(s) de la chorégraphie ?</label>
      <textarea data-path="impact.pourquoi" rows="3" class="w-full p-3">${esc(im.pourquoi)}</textarea></div>
    <div class="card p-4"><label class="text-sm font-semibold block mb-1">Qu'avez-vous préféré dans votre travail de création ?</label>
      <textarea data-path="impact.prefere" rows="3" class="w-full p-3">${esc(im.prefere)}</textarea></div>`;
  }
  if(t==="lexique"){
    return `<div class="card p-3"><input id="lex-search" type="text" placeholder="🔍 Rechercher un terme..." class="w-full p-3"></div>
    <div id="lex-list" class="space-y-3 mt-3"></div>`;
  }
  return '';
}

function renderLexiqueList(filter){
  const f = (filter||'').trim().toLowerCase();
  const items = LEXIQUE.filter(l => !f || l.terme.toLowerCase().includes(f) || l.def.toLowerCase().includes(f) || l.theme.toLowerCase().includes(f));
  const grouped = {};
  items.forEach(l=>{ (grouped[l.theme] = grouped[l.theme]||[]).push(l); });
  const keys = Object.keys(grouped);
  if(keys.length===0) return `<p class="text-center py-6" style="color:var(--muted)">Aucun terme trouvé.</p>`;
  return keys.map(theme=>`
    <div><div class="text-xs font-semibold uppercase tracking-wide mb-2" style="color:var(--accent)">${esc(theme)}</div>
      <div class="space-y-2">${grouped[theme].map(l=>`<div class="card p-3"><div class="font-semibold text-sm">${esc(l.terme)}</div><div class="text-sm mt-1" style="color:var(--muted)">${esc(l.def)}</div></div>`).join('')}</div>
    </div>`).join('');
}

function attachHandlers(){
  if(state.view==="home"){
    document.getElementById('btn-new').onclick = ()=>{ tempEleves=[{nom:"",prenom:""}]; state.view="create"; render(); };
    document.getElementById('btn-share').onclick = showShare;
    document.getElementById('close-share')?.addEventListener('click', ()=>document.getElementById('share-modal').classList.add('hidden'));
    document.querySelectorAll('.open-project').forEach(el=>el.onclick=()=>{ state.projectId=el.dataset.id; state.activeTab="general"; state.view="project"; render(); });
    document.querySelectorAll('.pdf-btn').forEach(el=>el.onclick=(ev)=>{ ev.stopPropagation(); exportPDF(loadProjects().find(p=>p.id===el.dataset.id)); });
    document.querySelectorAll('.del-btn').forEach(el=>el.onclick=(ev)=>{ ev.stopPropagation(); if(confirm('Supprimer ce projet ?')){ saveProjects(loadProjects().filter(p=>p.id!==el.dataset.id)); render(); } });
  } else if(state.view==="create"){
    document.getElementById('back-home').onclick = ()=>{ state.view="home"; render(); };
    document.getElementById('eleves-list').innerHTML = renderElevesList();
    bindEleveInputs();
    document.getElementById('add-eleve').onclick = ()=>{ tempEleves.push({nom:"",prenom:""}); document.getElementById('eleves-list').innerHTML=renderElevesList(); bindEleveInputs(); };
    document.getElementById('save-create').onclick = ()=>{
      const nom = document.getElementById('new-nom').value.trim() || "Nouveau projet";
      const p = emptyProject(nom); p.eleves = tempEleves.filter(e=>e.nom.trim()||e.prenom.trim());
      if(p.eleves.length===0) p.eleves=[{nom:"",prenom:""}];
      const projects = loadProjects(); projects.push(p); saveProjects(projects);
      state.projectId = p.id; state.activeTab="general"; state.view="project"; render();
    };
  } else if(state.view==="project"){
    document.getElementById('back-home').onclick = ()=>{ state.view="home"; render(); };
    const p = loadProjects().find(pr=>pr.id===state.projectId);
    document.getElementById('tab-content').innerHTML = fieldsForTab(p);
    document.querySelectorAll('.tab-btn').forEach(el=>el.onclick=()=>{ state.activeTab=el.dataset.tab; render(); });
    document.getElementById('edit-nom').addEventListener('blur', (e)=>updatePath('nom', e.target.value));
    document.querySelectorAll('textarea[data-path]').forEach(el=>{
      el.addEventListener('input', debounce(()=>updatePath(el.dataset.path, el.value), 400));
    });
    document.querySelectorAll('input.path-input[type=checkbox]').forEach(el=>{
      el.addEventListener('change', ()=>updatePath(el.dataset.path, el.checked));
    });
    document.querySelectorAll('input.path-input[type=radio]').forEach(el=>{
      el.addEventListener('change', ()=>{ if(el.checked) updatePath(el.dataset.path, el.value); });
    });
    if(state.activeTab==="lexique"){
      document.getElementById('lex-list').innerHTML = renderLexiqueList('');
      document.getElementById('lex-search').addEventListener('input', (e)=>{ document.getElementById('lex-list').innerHTML = renderLexiqueList(e.target.value); });
    }
    if(state.activeTab==="espace"){ initCanvas(p); }
    if(state.activeTab==="temps"){ initChrono(p); }
    document.getElementById('proj-pdf').onclick = ()=>exportPDF(loadProjects().find(pr=>pr.id===state.projectId));
  }
}

function bindEleveInputs(){
  document.querySelectorAll('.eleve-nom').forEach(el=>el.oninput=()=>{ tempEleves[el.dataset.i].nom = el.value; });
  document.querySelectorAll('.eleve-prenom').forEach(el=>el.oninput=()=>{ tempEleves[el.dataset.i].prenom = el.value; });
  document.querySelectorAll('.rm-eleve').forEach(el=>el.onclick=()=>{ tempEleves.splice(el.dataset.i,1); document.getElementById('eleves-list').innerHTML=renderElevesList(); bindEleveInputs(); });
}

function initCanvas(p){
  const canvas = document.getElementById('espace-canvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg') || '#faf7f5';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  if(p.espace.dessin){
    const img = new Image();
    img.onload = ()=> ctx.drawImage(img,0,0,canvas.width,canvas.height);
    img.src = p.espace.dessin;
  }
  ctx.lineWidth = 3; ctx.lineCap='round'; ctx.strokeStyle = '#c0447c';
  let drawing = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const t = e.touches && e.touches[0];
    const cx = (t? t.clientX : e.clientX) - rect.left;
    const cy = (t? t.clientY : e.clientY) - rect.top;
    return { x: cx * canvas.width/rect.width, y: cy * canvas.height/rect.height };
  }
  function start(e){ drawing=true; const q=pos(e); ctx.beginPath(); ctx.moveTo(q.x,q.y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const q=pos(e); ctx.lineTo(q.x,q.y); ctx.stroke(); e.preventDefault(); }
  function end(){ if(!drawing) return; drawing=false; updatePath('espace.dessin', canvas.toDataURL('image/png')); }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  document.getElementById('clear-canvas').onclick = ()=>{
    ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--bg') || '#faf7f5';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    updatePath('espace.dessin', null);
  };
}

function initChrono(p){
  const display = document.getElementById('chrono-display');
  let seconds = p.temps.duree || 0;
  document.getElementById('chrono-start').onclick = ()=>{
    if(chronoInterval) return;
    chronoInterval = setInterval(()=>{ seconds++; display.textContent = fmtTime(seconds); updatePath('temps.duree', seconds); }, 1000);
  };
  document.getElementById('chrono-stop').onclick = ()=>{ clearInterval(chronoInterval); chronoInterval=null; };
  document.getElementById('chrono-reset').onclick = ()=>{ clearInterval(chronoInterval); chronoInterval=null; seconds=0; display.textContent=fmtTime(0); updatePath('temps.duree',0); };
}

function showShare(){
  const modal = document.getElementById('share-modal');
  modal.classList.remove('hidden'); modal.classList.add('flex');
  const holder = document.getElementById('qr-holder');
  holder.innerHTML = '';
  try{ new QRCode(holder, { text: SHARE_URL, width:180, height:180, colorDark:"#2d2a32", colorLight:"#ffffff" }); }
  catch(e){ holder.innerHTML = '<p class="text-sm">QR indisponible</p>'; }
}

const PDF = {
  MARGIN:15, PINK:[192,68,124], PURPLE:[107,79,160], DARK:[45,42,50], MUTED:[140,133,146], LIGHT:[249,246,247],
  COL:{ general:[107,79,160], espace:[199,90,140], temps:[70,130,180], flux:[196,140,58],
        procedes:[80,150,112], interpretation:[142,92,190], impact:[206,84,92], lexique:[120,118,130] }
};

function pdfNewPage(doc){
  doc.addPage();
  doc.setFillColor(...PDF.PURPLE); doc.rect(0,0,210,5,'F');
  return 22;
}
function pdfCheckSpace(doc, y, needed){
  if(y + needed > 282){ return pdfNewPage(doc); }
  return y;
}
function pdfBanner(doc, title, color, y){
  y = pdfCheckSpace(doc, y, 16);
  doc.setFillColor(...color);
  doc.roundedRect(PDF.MARGIN, y, 210-PDF.MARGIN*2, 9, 2, 2, 'F');
  doc.setTextColor(255,255,255); doc.setFontSize(11); doc.setFont(undefined,'bold');
  doc.text(title, PDF.MARGIN+4, y+6.2);
  doc.setTextColor(...PDF.DARK);
  return y + 15;
}
function pdfLabel(doc, label, y){
  y = pdfCheckSpace(doc, y, 8);
  doc.setFontSize(8.5); doc.setFont(undefined,'bold'); doc.setTextColor(...PDF.MUTED);
  doc.text(label.toUpperCase(), PDF.MARGIN+2, y);
  doc.setTextColor(...PDF.DARK);
  return y + 5;
}
function pdfBody(doc, text, y){
  doc.setFontSize(10); doc.setFont(undefined,'normal'); doc.setTextColor(...PDF.DARK);
  const lines = doc.splitTextToSize(text && text.trim() ? text : "—", 210-PDF.MARGIN*2-4);
  lines.forEach(line=>{ y = pdfCheckSpace(doc, y, 6); doc.text(line, PDF.MARGIN+4, y); y+=5.3; });
  return y + 4;
}
function pdfChips(doc, labels, y, color){
  if(!labels.length){ return pdfBody(doc, "—", y); }
  const maxX = 210-PDF.MARGIN, chipH = 6.8, gap = 2.5;
  let x = PDF.MARGIN+4;
  y = pdfCheckSpace(doc, y, chipH+2);
  doc.setFontSize(8.7); doc.setFont(undefined,'normal');
  labels.forEach(label=>{
    const w = doc.getTextWidth(label) + 6;
    if(x + w > maxX){ x = PDF.MARGIN+4; y += chipH + gap; y = pdfCheckSpace(doc, y, chipH+2); }
    doc.setFillColor(color[0],color[1],color[2]);
    doc.roundedRect(x, y, w, chipH, 2, 2, 'F');
    doc.setTextColor(255,255,255);
    doc.text(label, x+3, y+4.6);
    x += w + gap;
  });
  doc.setTextColor(...PDF.DARK);
  return y + chipH + 7;
}
function pdfChecked(obj, labelMap){ return Object.keys(labelMap).filter(k=>obj[k]).map(k=>labelMap[k]); }

function exportPDF(p){
  if(!p) return;
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    doc.setFillColor(...PDF.PINK); doc.rect(0,0,210,48,'F');
    doc.setFillColor(...PDF.PURPLE); doc.rect(0,48,210,3,'F');
    doc.setTextColor(255,255,255);
    doc.setFontSize(10); doc.setFont(undefined,'normal');
    doc.text("MA CHORÉGRAPHIE — Dossier de création", PDF.MARGIN, 14);
    doc.setFontSize(21); doc.setFont(undefined,'bold');
    doc.text(doc.splitTextToSize(p.nom || "Projet", 180), PDF.MARGIN, 29);
    doc.setFontSize(9.5); doc.setFont(undefined,'normal');
    doc.text("Créé le " + p.date, PDF.MARGIN, 42);

    let y = 60;
    const eleves = p.eleves.filter(e=>e.nom||e.prenom).map(e=>`${e.prenom} ${e.nom}`.trim());
    const boxH = 13 + Math.max(eleves.length,1)*5.5;
    doc.setFillColor(...PDF.LIGHT); doc.setDrawColor(232,226,231);
    doc.roundedRect(PDF.MARGIN, y, 210-PDF.MARGIN*2, boxH, 3, 3, 'FD');
    doc.setTextColor(...PDF.DARK); doc.setFontSize(9.5); doc.setFont(undefined,'bold');
    doc.text("Élèves du groupe", PDF.MARGIN+4, y+8);
    doc.setFont(undefined,'normal'); doc.setFontSize(10);
    let ey = y+15;
    (eleves.length?eleves:["—"]).forEach(n=>{ doc.text("•  "+n, PDF.MARGIN+4, ey); ey+=5.5; });
    y += boxH + 10;

    y = pdfBanner(doc, "THÈME GÉNÉRAL", PDF.COL.general, y);
    y = pdfLabel(doc,"Thème de la chorégraphie",y); y = pdfBody(doc, p.theme, y);
    y = pdfLabel(doc,"Question / problématique",y); y = pdfBody(doc, p.question, y);
    y = pdfLabel(doc,"Réflexion du groupe",y); y = pdfBody(doc, p.reflexion, y);
    y = pdfLabel(doc,"Musique",y); y = pdfBody(doc, p.musique, y);

    y = pdfBanner(doc, "ESPACE", PDF.COL.espace, y);
    y = pdfLabel(doc,"Niveaux exploités",y); y = pdfChips(doc, pdfChecked(p.espace.niveaux,NIVEAUX_LABELS), y, PDF.COL.espace);
    y = pdfLabel(doc,"Espace corporel",y); y = pdfChips(doc, pdfChecked(p.espace.corporel,CORPOREL_LABELS), y, PDF.COL.espace);
    if(p.espace.dessin){
      y = pdfCheckSpace(doc, y, 58);
      y = pdfLabel(doc,"Trajet tracé sur la scène",y);
      try{ doc.addImage(p.espace.dessin, 'PNG', PDF.MARGIN+4, y, 100, 53); y += 58; }catch(e){}
    }
    y = pdfLabel(doc,"Comment les espaces servent le propos",y); y = pdfBody(doc, p.espace.propos, y);

    y = pdfBanner(doc, "TEMPS", PDF.COL.temps, y);
    y = pdfLabel(doc,"Durée chronométrée",y); y = pdfBody(doc, fmtTime(p.temps.duree), y);
    y = pdfLabel(doc,"Utilisations du temps",y); y = pdfChips(doc, pdfChecked(p.temps.checks,TEMPS_LABELS), y, PDF.COL.temps);
    y = pdfLabel(doc,"Comment le temps sert le propos",y); y = pdfBody(doc, p.temps.propos, y);

    y = pdfBanner(doc, "FLUX / ÉNERGIE", PDF.COL.flux, y);
    y = pdfLabel(doc,"Flux",y); y = pdfChips(doc, pdfChecked(p.flux.flux,FLUX_LABELS), y, PDF.COL.flux);
    y = pdfLabel(doc,"Énergie",y); y = pdfChips(doc, pdfChecked(p.flux.energie,ENERGIE_LABELS), y, PDF.COL.flux);
    y = pdfLabel(doc,"Comment ils servent le propos",y); y = pdfBody(doc, p.flux.propos, y);

    y = pdfBanner(doc, "PROCÉDÉS DE COMPOSITION", PDF.COL.procedes, y);
    y = pdfLabel(doc,"Structure",y); y = pdfChips(doc, [STRUCTURE_LABELS[p.procedes.structure]].filter(Boolean), y, PDF.COL.procedes);
    y = pdfLabel(doc,"Procédés utilisés",y); y = pdfChips(doc, pdfChecked(p.procedes.checks,PROCEDES_LABELS), y, PDF.COL.procedes);
    y = pdfLabel(doc,"Relations entre danseurs",y); y = pdfChips(doc, pdfChecked(p.procedes.relations,RELATIONS_LABELS), y, PDF.COL.procedes);
    y = pdfLabel(doc,"Comment ils servent le propos",y); y = pdfBody(doc, p.procedes.propos, y);

    y = pdfBanner(doc, "INTERPRÉTATION", PDF.COL.interpretation, y);
    y = pdfLabel(doc,"Placement du regard",y); y = pdfChips(doc, [REGARD_LABELS[p.interpretation.regard]].filter(Boolean), y, PDF.COL.interpretation);
    y = pdfLabel(doc,"Technique corporelle",y); y = pdfChips(doc, [TECHNIQUE_LABELS[p.interpretation.technique]].filter(Boolean), y, PDF.COL.interpretation);
    y = pdfLabel(doc,"Mémorisation",y); y = pdfChips(doc, [MEMO_LABELS[p.interpretation.memorisation]].filter(Boolean), y, PDF.COL.interpretation);
    y = pdfLabel(doc,"Engagement émotionnel",y); y = pdfChips(doc, [ENGAGEMENT_LABELS[p.interpretation.engagement]].filter(Boolean), y, PDF.COL.interpretation);

    y = pdfBanner(doc, "IMPACT ÉMOTIONNEL", PDF.COL.impact, y);
    y = pdfLabel(doc,"Émotion recherchée",y); y = pdfBody(doc, p.impact.ressenti, y);
    y = pdfLabel(doc,"Pourquoi / à quels moments",y); y = pdfBody(doc, p.impact.pourquoi, y);
    y = pdfLabel(doc,"Ce que le groupe a préféré",y); y = pdfBody(doc, p.impact.prefere, y);

    const total = doc.internal.getNumberOfPages();
    for(let i=1;i<=total;i++){
      doc.setPage(i);
      doc.setFontSize(8); doc.setTextColor(...PDF.MUTED);
      doc.text(`${p.nom||'Projet'}`, PDF.MARGIN, 293);
      doc.text(`Page ${i}/${total}`, 210-PDF.MARGIN, 293, {align:'right'});
    }

    doc.save((p.nom||"projet").replace(/[^a-z0-9]/gi,'_') + ".pdf");
  }catch(e){ alert("Export PDF impossible : " + e.message); }
}

render();
